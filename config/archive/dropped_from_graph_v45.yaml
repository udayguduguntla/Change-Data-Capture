# Tables removed from the knowledge graph in v4.5 (configuration plumbing, internal
# logs, high-volume metrics, copies of another product's data, or duplicates).
# To bring one back, move its block into core.yaml and run `main.py validate`.
# Tables removed from the knowledge graph in v4.5 (configuration plumbing, internal
# logs, high-volume metrics, copies of another product's data, or duplicates).
# To bring one back, move its block into core.yaml and run `main.py validate`.
# Tables removed from the knowledge graph in v4.5 (configuration plumbing, internal
# logs, high-volume metrics, or duplicates of another table). Kept here for reference;
# to bring one back, move its block into core.yaml and run `main.py validate`.
tables:
  accounts.setup_ccaas_queue_agents:
    product: ccaas
    tenant:
      via:
      - {column: queue_id, parent: accounts.setup_ccaas_queues, parent_key: id}
    mode: relationship_only
    access: {domain: common, module: setup, sensitivity: L1}
    from: {label: QueueSetup, key: id, column: queue_id}
    to: {label: Employee, key: id, column: user_id}
    type: has_member
    properties: [shift_type, call_type, handles_calls, handles_chat, handles_email, handles_social, handles_whatsapp, 
        handles_instagram, handles_facebook, chat_concurrency, email_concurrency, social_concurrency]
  accounts.setup_ccaas_queues:
    product: ccaas
    label: QueueSetup
    key: id
    access: {domain: common, module: setup, sensitivity: L1}
    edge_budget: 3
    properties: [id, organization_id, team_id, name, description, status, business_hours_id, shift_types, skills, 
        missed_callback_grace_minutes, created_at, updated_at]
    relationships:
    - {type: owned_by_team, to: Team, to_key: id, from_column: team_id}
    - {type: follows_hours, to: BusinessHours, to_key: id, from_column: business_hours_id}

  accounts.setup_queue_routing_profiles:
    product: ccaas
    label: RoutingProfile
    key: uid
    synthesize_key: "setup:{id}"
    access: {domain: common, module: setup, sensitivity: L1}
    edge_budget: 1
    sublabels: {static: DraftRoutingProfile}
    custom_field: skill_mapping
    custom_dynamic: true
    properties: [id, organization_id, queue_id, description, supported_intents, example_phrases, language_codes, 
        classifier_version, created_at, updated_at]
    relationships:
    - {type: has_routing_profile, from: QueueSetup, from_key: id, from_column: queue_id}

  accounts.setup_user_product_access:
    product: platform
    mode: relationship_only
    access: {domain: common, module: identity, sensitivity: L1}
    from: {label: Employee, key: id, column: user_id}
    to: {label: Role, key: id, column: role_id}
    type: holds_role

  # --- business hours --------------------------------------------------------

  accounts.setup_voice_prompt_profiles:
    product: ccaas
    label: VoicePromptSet
    key: id
    access: {domain: common, module: setup, sensitivity: L1}
    edge_budget: 1
    custom_field: slots
    custom_dynamic: true
    properties: [id, organization_id, name, description, status, created_at, updated_at]
    relationships:
  campaign.app_notifications:
    embed:
      fields: [kind, title, body]
      property: _embedding
    product: platform
    readable_by: [crm, ticketing, campaign]
    merges_into: Notification
    key: uid
    synthesize_key: "campaign:{id}"
    access: {domain: campaign, module: workspace, sensitivity: L1}
    edge_budget: 2
    sublabels: {static: MarketingNotification}
    properties: [id, organization_id, user_id, kind, title, body, href, source_key, subject_kind, subject_id, created_at,
      read_at]
    relationships:
    - {type: about_campaign, to: Campaign, to_key: id, from_column: subject_id, when: {subject_kind: [campaign]}}
    - {type: about_template, to: RegisteredTemplate, to_key: id, from_column: subject_id, when: {subject_kind: [template,
          whatsapp]}}

# DECLARED STUB LABELS -- nodes created only as relationship endpoints.
  campaign.branches:
    emit_to_graph: false
    product: platform
    label: Branch
    key: id
    access: {domain: campaign, module: marketing, sensitivity: L1}
    edge_budget: 1
    properties: [id, organization_id, name, is_default, created_at, updated_at]
    relationships:
  campaign.campaign_audience_refs:
    product: campaign
    tenant:
      via:
      - {column: session_id, parent: campaign.campaign_agent_sessions, parent_key: id}
    mode: relationship_only
    access: {domain: campaign, module: marketing, sensitivity: L2}
    from: {label: DraftAudience, key: id, column: session_id}
    to: {label: Contact, key: cdp_id, column: contact_id}
    type: contains

  campaign.campaign_channels:
    product: campaign
    label: ChannelPlan
    key: id
    access: {domain: campaign, module: marketing, sensitivity: L1}
    edge_budget: 2
    properties: [id, campaign_id, organization_id, channel, template_id, how_it_works, planned_launch_at, status, 
        created_at, updated_at]
    relationships:
    - {type: has_channel_plan, from: Campaign, from_key: id, from_column: campaign_id}
    - {type: uses_template, to: MessageTemplate, to_key: id, from_column: template_id}

  campaign.campaign_recommendations:
    product: campaign
    label: CampaignIdea
    key: id
    access: {domain: campaign, module: marketing, sensitivity: L1}
    edge_budget: 2
    properties: [id, organization_id, branch_id, created_by_user_id, public_id, status, title, created_at, updated_at]
    relationships:
    resolve_later:
    - "status=used has no column recording which campaign or draft consumed the idea. Persist used_campaign_id, then add used_in
      -> Campaign."

  campaign.campaign_send_batches:
    product: campaign
    label: SendBatch
    key: id
    access: {domain: campaign, module: marketing, sensitivity: L1}
    edge_budget: 3
    properties: [id, organization_id, campaign_id, channel, seq, scheduled_for, status, size, created_at, updated_at]
    relationships:
    - {type: has_batch, from: Campaign, from_key: id, from_column: campaign_id}
    - {type: limited_by, to: SendingLimit, to_key: organization_id, from_column: organization_id}
    - {type: complies_with, to: SenderProfile, to_key: organization_id, from_column: organization_id}

  campaign.campaign_template_messages:
    product: campaign
    tenant:
      via:
      - {column: template_id, parent: campaign.campaign_channel_templates, parent_key: id}
    label: TemplateVersion
    key: id
    access: {domain: campaign, module: marketing, sensitivity: L1}
    edge_budget: 1
    properties: [id, template_id, role, seq, kind, created_at]
    relationships:
    - {type: has_version, from: MessageTemplate, from_key: id, from_column: template_id}

  campaign.channel_sending_profiles:
    product: campaign
    label: ChannelReadiness
    key: id
    access: {domain: campaign, module: marketing, sensitivity: L1}
    edge_budget: 2
    custom_field: checklist
    custom_dynamic: true
    properties: [id, organization_id, channel, status, created_at, updated_at]
    relationships:
    - {type: for_channel, to: Channel, to_key: name, from_column: channel, create_target: true}

  campaign.email_domains:
    product: campaign
    label: EmailDomain
    key: id
    access: {domain: campaign, module: marketing, sensitivity: L1}
    edge_budget: 1
    extra_labels:
    - {label: VerifiedDomain, when: {spf_ok: [true], dkim_ok: [true], dmarc_ok: [true]}}
    properties: [id, organization_id, domain, spf_ok, dkim_ok, dmarc_ok, status, provider_domain_id, dns_records, 
        dkim_selector, dkim_public_key, created_at, updated_at]
    relationships:
  campaign.email_org_profiles:
    product: campaign
    label: SenderProfile
    key: organization_id
    access: {domain: campaign, module: marketing, sensitivity: L1}
    edge_budget: 1
    properties: [organization_id, legal_name, street, city, country, phone, created_at, updated_at]
    relationships:
  campaign.email_return_paths:
    product: campaign
    label: BounceDomain
    key: organization_id
    access: {domain: campaign, module: marketing, sensitivity: L1}
    edge_budget: 1
    properties: [organization_id, domain, status, created_at, updated_at]
    relationships:
  campaign.email_senders:
    product: campaign
    label: SenderEmail
    key: id
    access: {domain: campaign, module: marketing, sensitivity: L2}
    edge_budget: 2
    properties: [id, organization_id, display_name, from_email, reply_to, status, verified_at, is_active, created_at, 
        updated_at]
    relationships:
    - {type: verified_on, to: EmailDomain, match_fields: {domain: sender_domain, organization_id: organization_id}}
    derived_here: {sender_domain: "lower(split_part(from_email, '@', 2))"}
  campaign.email_sending_caps:
    product: campaign
    label: SendingLimit
    key: organization_id
    access: {domain: campaign, module: marketing, sensitivity: L1}
    edge_budget: 1
    custom_field: health_stats
    custom_dynamic: true
    properties: [organization_id, batch_size, hourly_cap, daily_cap, warmup_stage, health_status, created_at, updated_at]
    relationships:
  campaign.organization_products:
    product: platform
    label: Subscription
    key: id
    access: {domain: campaign, module: marketing, sensitivity: L1}
    edge_budget: 2
    properties: [id, organization_id, branch_id, product_code, status, starts_at, ends_at, created_at, updated_at]
    relationships:
    - {type: for_app, to: PlatformApp, to_key: code, from_column: product_code, create_target: true}
    verify: "product_code is a Prisma enum (campaign | crm). Role.product_id uses slugs (crm | contact-center). Both MERGE
      into PlatformApp — reconcile the vocabularies or the label holds two id spaces."

  campaign.push_channel_settings:
    product: campaign
    label: ChannelSettings
    key: uid
    synthesize_key: "push:{id}"
    access: {domain: campaign, module: marketing, sensitivity: L1}
    edge_budget: 1
    sublabels: {static: PushSettings}
    properties: [id, organization_id, channel, status, created_at, updated_at]
    relationships:
  campaign.push_endpoints:
    collection: {name: PushSubscriptionSet, owner_column: contact_id}
    product: campaign
    label: PushSubscription
    key: id
    access: {domain: campaign, module: marketing, sensitivity: L2}
    edge_budget: 1
    properties: [id, organization_id, contact_id, channel, platform, endpoint, label, active, created_at, updated_at]
    relationships:
  campaign.regulated_channel_templates:
    product: campaign
    label: RegisteredTemplate
    key: id
    access: {domain: campaign, module: marketing, sensitivity: L1}
    edge_budget: 3
    extra_labels:
    - {label: PendingTemplate, when: {status: [pending]}}
    - {label: RejectedTemplate, when: {status: [rejected]}}
    properties: [id, organization_id, channel, name, external_id, provider_template_id, language, category, header, body,
      footer, buttons, status, rejected_reason, channel_config_id, submitted_at, last_status_checked_at, 
        created_by_user_id, campaign_name, goal, objective, source_campaign_id, created_at, updated_at]
    relationships:
    - {type: for_channel, to: Channel, to_key: name, from_column: channel}
    - {type: for_campaign, to: Campaign, to_key: id, from_column: source_campaign_id}
    verify: "channel_config_id is bigint in the campaign schema and uuid in the accounts schema per its reference. Confirm
      the type before enabling sends_via."

  # --- sending readiness -----------------------------------------------------

  campaign.sms_channel_settings:
    product: campaign
    merges_into: ChannelSettings
    key: uid
    synthesize_key: "sms:{id}"
    access: {domain: campaign, module: marketing, sensitivity: L1}
    edge_budget: 1
    sublabels: {static: SmsSettings}
    properties: [id, organization_id, channel, status, created_at, updated_at]
    relationships:
  campaign.tenant_industry_packs:
    product: platform
    label: IndustryPack
    key: organization_id
    access: {domain: campaign, module: marketing, sensitivity: L1}
    edge_budget: 1
    properties: [organization_id, pack_id, seed_industry_type, created_at, updated_at]
    relationships:
  ccass.agent_capacity:
    product: ccaas
    label: ChannelCapacity
    key: id
    access: {domain: ccaas, module: workforce, sensitivity: L1}
    edge_budget: 1
    properties: [id, organization_id, agent_id, channel, max_concurrency, reserved_count, active_count, version, 
        updated_at]
    relationships:
    - {type: has_capacity, from: Staff, from_key: uid, from_column: agent_id, from_key_template: "service:{agent_id}"}

  ccass.channel_automation_policies:
    product: ccaas
    label: BotPolicy
    key: uid
    synthesize_key: "channel:{id}"
    access: {domain: ccaas, module: automation, sensitivity: L1}
    edge_budget: 3
    sublabels: {static: ChannelBotPolicy}
    custom_field: channel_settings
    custom_dynamic: true
    properties: [id, organization_id, channel_config_id, channel, bot_enabled, live_agent_enabled, automation_mode, {
          name: confidence_threshold, type: decimal, scale: 3}, default_queue_id, handoff_message, no_agent_behavior, 
        inactivity_close_seconds, shadow_mode, policy_version, status, created_at, updated_at]
    relationships:
    - {type: for_channel, to: Channel, to_key: name, from_column: channel}
    - {type: default_queue, to: Queue, to_key: uid, from_column: default_queue_id, to_key_template: "service:{default_queue_id}"}

  ccass.conversation_assignments:
    product: ccaas
    label: Assignment
    key: id
    access: {domain: ccaas, module: routing, sensitivity: L1}
    edge_budget: 3
    collection: {name: RoutingHistory, owner_column: queue_id, owner_template: "service:{queue_id}", bucket_column: 
        offered_at}
    properties: [id, organization_id, conversation_id, queue_id, agent_id, routing_attempt_id, state, reason, offered_at,
      accepted_at, rejected_at, expired_at, ended_at, expires_at]
    relationships:
    - {type: assigns, to: Conversation, to_key: id, from_column: conversation_id}
    - {type: offered_to, to: Staff, to_key: uid, from_column: agent_id, to_key_template: "service:{agent_id}"}

  ccass.conversation_dispositions:
    product: ccaas
    label: ConversationOutcome
    key: id
    access: {domain: ccaas, module: conversations, sensitivity: L1}
    edge_budget: 2
    custom_field: resolution_data
    custom_dynamic: true
    properties: [id, organization_id, conversation_id, disposition_id, agent_id, applied_by_user_id, note, source, 
        resolution_code, is_final, applied_at, updated_at]
    relationships:
    - {type: has_outcome, from: Conversation, from_key: id, from_column: conversation_id}
    - {type: applied_by, to: Employee, to_key: id, from_column: applied_by_user_id}
    # disposition_id stays a property.

  ccass.conversation_message_attachments:
    product: ccaas
    label: Attachment
    key: id
    access: {domain: ccaas, module: conversations, sensitivity: L2}
    edge_budget: 1
    properties: [id, organization_id, conversation_id, message_id, external_id, storage_key, file_name, content_type, 
        byte_size, checksum_sha256, status, created_at]
    relationships:
    - {type: has_attachment, from: Message, from_key: id, from_column: message_id}
    note: "An attachment hangs off its message; the message hangs off its conversation."

  ccass.conversation_messages:
    product: ccaas
    label: Message
    key: id
    access: {domain: ccaas, module: conversations, sensitivity: L2}
    # Metadata only. The body stays in Postgres (volume and personal data); agents fetch
    # it by message id when they need the text. To store it, add `body` to properties.
    properties: [id, organization_id, conversation_id, sender_type, recipient_type, direction, visibility, message_type, 
        delivery_state, attachment_count, reply_to_message_id, created_at, sent_at, delivered_at]
    relationships:
      # A message is connected to its conversation and to nothing else.
    - {type: has_message, from: Conversation, from_key: id, from_column: conversation_id}

  ccass.conversation_participants:
    product: ccaas
    label: Participant
    key: id
    access: {domain: ccaas, module: conversations, sensitivity: L2}
    edge_budget: 1
    properties: [id, organization_id, conversation_id, participant_type, identity_ref, joined_at, left_at]
    relationships:
    - {type: has_participant, from: Conversation, from_key: id, from_column: conversation_id}
    resolve_later:
    - "identity_ref is a channel identity string (email / visitor id / psid), not an agent id and not a cdp_id. Resolve through
      ContactIdentity (org, type, value) once identity_type is available on this table, then add participant_is -> Customer
      | Staff."

  ccass.conversation_sla_state:
    product: ccaas
    label: SlaTimer
    key: id
    access: {domain: ccaas, module: conversations, sensitivity: L1}
    edge_budget: 2
    properties: [id, organization_id, conversation_id, sla_policy_id, first_response_due_at, resolution_due_at, 
        first_response_warning_at, resolution_warning_at, breached_at, updated_at]
    relationships:
    - {type: has_sla_timer, from: Conversation, from_key: id, from_column: conversation_id}
    - {type: governed_by, to: SLA, to_key: uid, from_column: sla_policy_id, to_key_template: "service:{sla_policy_id}"}

  ccass.dispositions:
    product: ccaas
    label: OutcomeCode
    key: id
    access: {domain: ccaas, module: automation, sensitivity: L1}
    edge_budget: 1
    properties: [id, organization_id, code, label, description, category, outcome, requires_note, requires_resolution, 
        is_active, sort_order, created_at, updated_at]
    relationships:
  ccass.email_mailbox_policies:
    product: ccaas
    merges_into: BotPolicy
    key: uid
    synthesize_key: "mailbox:{id}"
    access: {domain: ccaas, module: automation, sensitivity: L2}
    edge_budget: 2
    sublabels: {static: EmailBotPolicy}
    properties: [id, organization_id, connection_id, account_email, bot_enabled, live_agent_enabled, shadow_mode, 
        auto_send_enabled, {name: confidence_threshold, type: decimal, scale: 3}, default_queue_id, business_hours_mode, 
        policy_version, status, inactivity_close_hours, created_at, updated_at]
    relationships:
    - {type: default_queue, to: Queue, to_key: uid, from_column: default_queue_id, to_key_template: "service:{default_queue_id}"}

  ccass.nlp_conversations:
    product: ccaas
    label: BotSession
    key: id
    access: {domain: ccaas, module: automation, sensitivity: L1}
    edge_budget: 2
    properties: [id, organization_id, conversation_id, runtime_type, skill_version_id, status, started_at, ended_at, 
        end_reason, created_at, updated_at]
    relationships:
    - {type: has_bot_session, from: Conversation, from_key: id, from_column: conversation_id}
    - {type: used_version, to: BotSkillVersion, to_key: id, from_column: skill_version_id}

  # --- cross-product interaction rollup --------------------------------------

  ccass.nlp_skill_bindings:
    product: ccaas
    label: BotDeployment
    key: id
    access: {domain: ccaas, module: automation, sensitivity: L1}
    edge_budget: 1
    custom_field: overrides
    custom_dynamic: true
    properties: [id, organization_id, skill_version_id, role, surface, channel, priority, effective_from, effective_to, 
        enabled, created_at]
    relationships:
    - {type: deployed_as, from: BotSkillVersion, from_key: id, from_column: skill_version_id}

  ccass.nlp_skill_tools:
    product: ccaas
    label: BotTool
    key: id
    access: {domain: ccaas, module: automation, sensitivity: L1}
    edge_budget: 1
    properties: [id, organization_id, skill_version_id, tool_key, permission_class, requires_confirmation, created_at]
    relationships:
    - {type: has_tool, from: BotSkillVersion, from_key: id, from_column: skill_version_id}

  ccass.nlp_skill_versions:
    product: ccaas
    label: BotSkillVersion
    key: id
    access: {domain: ccaas, module: automation, sensitivity: L1}
    edge_budget: 1
    custom_field: model_policy
    custom_dynamic: true
    properties: [id, organization_id, skill_id, version_number, checksum, state, published_at, created_at]
    relationships:
    - {type: has_version, from: BotSkill, from_key: id, from_column: skill_id}

  ccass.nlp_skills:
    product: ccaas
    label: BotSkill
    key: id
    access: {domain: ccaas, module: automation, sensitivity: L1}
    edge_budget: 2
    properties: [id, organization_id, skill_key, name, description, skill_type, owner_user_id, state, created_at, 
        updated_at]
    relationships:
    - {type: owned_by, to: Employee, to_key: id, from_column: owner_user_id}

  ccass.presence_reason_codes:
    product: ccaas
    label: StatusReason
    key: id
    access: {domain: ccaas, module: workforce, sensitivity: L1}
    edge_budget: 1
    properties: [id, organization_id, code, label, presence_state, requires_note, is_active, created_at, updated_at]
    relationships:
  ccass.routing_attempts:
    product: ccaas
    label: RoutingAttempt
    key: id
    access: {domain: ccaas, module: routing, sensitivity: L1}
    edge_budget: 2
    collection: {name: RoutingHistory, owner_column: queue_id, owner_template: "service:{queue_id}", bucket_column: 
        created_at}
    properties: [id, organization_id, conversation_id, queue_id, agent_id, attempt_number, outcome, created_at, 
        completed_at]
    relationships:
    - {type: attempt_for, to: Conversation, to_key: id, from_column: conversation_id}

  ccass.routing_policies:
    product: ccaas
    label: RoutingPolicy
    key: id
    access: {domain: ccaas, module: routing, sensitivity: L1}
    edge_budget: 2
    properties: [id, organization_id, queue_id, strategy, priority, offer_timeout_seconds, max_attempts, 
        overflow_queue_id, after_contact_work_seconds, email_offer_timeout_seconds, email_first_response_sla_seconds, 
        email_resolution_sla_seconds, email_after_contact_work_seconds, missed_callback_grace_minutes, created_at, 
        updated_at]
    relationships:
    - {type: has_routing_policy, from: Queue, from_key: uid, from_column: queue_id, to_key_template: "service:{queue_id}"}
    - {type: overflows_to, to: Queue, to_key: uid, from_column: overflow_queue_id, to_key_template: "service:{overflow_queue_id}"}

  # --- policies (three tables, one concept) ----------------------------------

  ccass.webchat_sessions:
    product: ccaas
    label: ChatSession
    key: id
    access: {domain: ccaas, module: conversations, sensitivity: L2}
    edge_budget: 1
    custom_field: prechat_answers
    custom_dynamic: true
    properties: [id, organization_id, conversation_id, webchat_id, visitor_id, page_origin, page_url, created_at, 
        updated_at, ended_at, end_reason, ended_by]
    relationships:
    - {type: has_chat_session, from: Conversation, from_key: id, from_column: conversation_id}

  ccass.whatsapp_channel_policies:
    product: ccaas
    merges_into: BotPolicy
    key: uid
    synthesize_key: "whatsapp:{id}"
    access: {domain: ccaas, module: automation, sensitivity: L1}
    edge_budget: 3
    sublabels: {static: WhatsAppBotPolicy}
    properties: [id, organization_id, channel_config_id, bot_enabled, live_agent_enabled, {name: confidence_threshold, 
          type: decimal, scale: 3}, default_queue_id, approved_handoff_message, inactivity_close_hours, status, 
        created_at, updated_at]
    relationships:
    - {type: for_channel, to: Channel, to_key: name, from_column: channel}
    - {type: default_queue, to: Queue, to_key: uid, from_column: default_queue_id, to_key_template: "service:{default_queue_id}"}

  ccass.workspace_common_notes:
    product: ccaas
    merges_into: InternalNote
    key: uid
    synthesize_key: "workspace:{id}"
    access: {domain: ccaas, module: conversations, sensitivity: L2}
    edge_budget: 2
    sublabels: {static: WorkspaceNote}
    properties: [id, organization_id, author_user_id, body, created_at, updated_at]
    relationships:
    - {type: written_by, to: Employee, to_key: id, from_column: author_user_id}

  cdp.activation_tasks:
    product: cdp
    table: cdp.activation_tasks
    label: ActivationTask
    key: task_id
    access: {domain: cdp, module: intelligence, sensitivity: L1}
    edge_budget: 1
    collection: {name: CdpActivityHistory, owner_column: cdp_id, bucket_column: created_at}
    properties: [task_id, organization_id, cdp_id, channel, task_type, status, created_at, emitted_at]

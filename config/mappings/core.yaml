tables:

  # TENANT AND WORKFORCE  (source: accounts)

  accounts.organizations:
    embed:
      fields: [company_name, industry_type, business_type, country]
      property: _embedding
    product: platform
    label: Tenant
    key: id
    access: {domain: common, module: identity, sensitivity: L2}
    edge_budget: 9
    properties: [id, tenant_id, company_name, industry_type, business_type, contact_name, designation, work_email, 
        admin_email, tax_number, billing_address, website_url, country, company_size, mobile_country_code, mobile_number,
      lifecycle_status, converted_at, reseller_id, source_lead_id, created_at, updated_at]
    overlay_selector: industry_type

    owns_collections: [UserDirectory, TeamDirectory, ChannelDirectory, KnowledgeLibrary, ProductCatalog, MacroLibrary]
  accounts.setup_users:
    product: platform
    label: User
    key: id
    access: {domain: common, module: identity, sensitivity: L2}
    edge_budget: 3
    properties: [id, organization_id, employee_id, first_name, last_name, work_email, mobile_number, primary_language, 
        secondary_language, skills, shift_types, city, state, country, location_id, status, team_id, business_hours_id, 
        invite_status, password_set_at, invited_at, created_at, updated_at]
    relationships:
    - {type: member_of, to: Team, to_key: id, from_column: team_id}
    - {type: follows, to: BusinessHours, to_key: id, from_column: business_hours_id}
    collection: {name: UserDirectory, owner_column: organization_id}
  accounts.setup_teams:
    product: platform
    label: Team
    key: id
    access: {domain: common, module: identity, sensitivity: L1}
    edge_budget: 2
    properties: [id, organization_id, name, description, business_hours_id, available_products, status, created_at, 
        updated_at]
    relationships:
    - {type: follows, to: BusinessHours, to_key: id, from_column: business_hours_id}
    collection: {name: TeamDirectory, owner_column: organization_id}
  accounts.setup_roles:
    product: platform
    label: Role
    key: id
    access: {domain: common, module: identity, sensitivity: L1}
    edge_budget: 2
    properties: [id, organization_id, name, description, product_id, accessible_products, module_permission, 
        module_permissions, can_view, can_create, can_edit, can_delete, can_export, can_approve, created_at, updated_at]
  accounts.setup_business_hours:
    product: platform
    readable_by: [ccaas, ticketing]
    label: BusinessHours
    key: id
    access: {domain: common, module: setup, sensitivity: L1}
    edge_budget: 2
    properties: [id, organization_id, name, description, timezone, status, open_time, close_time, timing_mode, 
        working_days, day_timings, holiday_calendar_id, created_at, updated_at]
    relationships:
    - {type: follows, to: HolidayCalendar, to_key: id, from_column: holiday_calendar_id}
  accounts.setup_business_hour_shifts:
    product: platform
    readable_by: [ccaas, ticketing]
    tenant:
      via:
      - {column: business_hours_id, parent: accounts.setup_business_hours, parent_key: id}
    label: Shift
    key: id
    access: {domain: common, module: setup, sensitivity: L1}
    edge_budget: 1
    properties: [id, business_hours_id, shift_type, day_of_week, end_day_of_week, start_time, end_time, crosses_midnight,
      break_start_time, break_end_time, break_start_time_2, break_end_time_2, created_at]
    relationships:
    - {type: has, from: BusinessHours, from_key: id, from_column: business_hours_id}
  accounts.setup_holiday_calendars:
    product: platform
    readable_by: [ccaas, ticketing]
    label: HolidayCalendar
    key: id
    access: {domain: common, module: setup, sensitivity: L1}
    edge_budget: 1
    properties: [id, organization_id, name, country, created_at, updated_at]
    relationships:

  accounts.setup_holidays:
    product: platform
    readable_by: [ccaas, ticketing]
    tenant:
      via:
      - {column: calendar_id, parent: accounts.setup_holiday_calendars, parent_key: id}
    label: Holiday
    key: id
    access: {domain: common, module: setup, sensitivity: L1}
    edge_budget: 1
    properties: [id, calendar_id, name, holiday_date, created_at]
    relationships:
    - {type: has, from: HolidayCalendar, from_key: id, from_column: calendar_id}
  accounts.setup_channel_configs:
    product: platform
    readable_by: [ccaas, campaign, ticketing]
    label: Channel
    key: id
    access: {domain: common, module: setup, sensitivity: L1}
    edge_budget: 2
    properties: [id, organization_id, channel_type, name, status, product_ids, created_at, updated_at]
    collection: {name: ChannelDirectory, owner_column: organization_id}

  accounts.setup_email_configs:
    # Adds properties to a node another table owns: a delete here removes only what it added.
    on_delete: remove_own_properties
    product: platform
    readable_by: [ccaas, campaign, ticketing]
    tenant:
      via:
      - {column: channel_config_id, parent: accounts.setup_channel_configs, parent_key: id}
    merges_into: Channel
    key: id
    key_column: channel_config_id
    sublabels: {static: EmailChannel}
    access: {domain: common, module: setup, sensitivity: L2}
    edge_budget: 0
    properties:
    - organization_id    # injected by tenant resolution
    - channel_config_id
    - {from: provider_type, as: email_provider_type}
    - {from: sender_email, as: email_sender_address}
    - {from: sender_name, as: email_sender_name}
    - {from: reply_to, as: email_reply_to}
    - {from: domain, as: email_domain}
    - {from: oauth_provider, as: email_oauth_provider}
    - {from: ccaas_handler, as: email_service_handler}
    - {from: is_bot, as: email_bot_mailbox}
    - {from: provisioning_status, as: email_provisioning_status}
    - {from: oauth_connection_id, as: email_connection_id}
    relationships:
    # secrets excluded by policy: smtp_*, imap_*, *_encrypted, oauth_connection_id

  accounts.setup_webchat_configs:
    # Adds properties to a node another table owns: a delete here removes only what it added.
    on_delete: remove_own_properties
    product: platform
    readable_by: [ccaas]
    tenant:
      via:
      - {column: channel_config_id, parent: accounts.setup_channel_configs, parent_key: id}
    merges_into: Channel
    key: id
    key_column: channel_config_id
    sublabels: {static: ChatChannel}
    access: {domain: common, module: setup, sensitivity: L1}
    edge_budget: 1
    custom_field: personalisation
    custom_dynamic: true
    properties:
    - organization_id    # injected by tenant resolution
    - channel_config_id
    - routing_queue_id
    - {from: webchat_id, as: chat_widget_id}
    - {from: title, as: chat_title}
    - {from: alias_title, as: chat_alias_title}
    - {from: description, as: chat_description}
    - {from: greeting_message, as: chat_greeting}
    - {from: trigger_message, as: chat_trigger}
    relationships:
    - {type: routes_to, to: ContactCentreQueue, match_fields: {setup_queue_id: routing_queue_id}}
  accounts.setup_social_configs:
    # Adds properties to a node another table owns: a delete here removes only what it added.
    on_delete: remove_own_properties
    product: platform
    readable_by: [ccaas, campaign]
    tenant:
      via:
      - {column: channel_config_id, parent: accounts.setup_channel_configs, parent_key: id}
    merges_into: Channel
    key: id
    key_column: channel_config_id
    sublabels: {static: SocialChannel}
    access: {domain: common, module: setup, sensitivity: L1}
    edge_budget: 0
    properties:
    - organization_id    # injected by tenant resolution
    - channel_config_id
    - {from: provider, as: social_provider}
    - {from: bot_enabled, as: social_bot_enabled}
    - {from: usage_mode, as: social_usage_mode}
    - {from: display_number, as: social_display_number}
    - {from: waba_id, as: social_waba_id}
    - {from: phone_number_id, as: social_phone_number_id}
    - {from: page_id, as: social_page_id}
    - {from: ig_business_account_id, as: social_ig_account_id}
    - {from: meta_auth_type, as: social_auth_type}
    - {from: meta_connection_status, as: social_connection_status}
    relationships:
    # secrets excluded by policy: access_token_encrypted, token_expires_at

  accounts.setup_voice_dids:
    product: ccaas
    label: PhoneNumber
    key: id
    access: {domain: common, module: setup, sensitivity: L2}
    edge_budget: 4
    properties: [id, organization_id, phone_number, product_id, routing_type, status, prompt_profile_id, 
        routing_queue_id, routing_user_id, created_at, updated_at]
    relationships:
    - {type: routes_to, to: ContactCentreQueue, match_fields: {setup_queue_id: routing_queue_id}}
    - {type: routes_to, to: User, to_key: id, from_column: routing_user_id}
  accounts.setup_knowledge_documents:
    embed:
      fields: [file_name, category, product_id]
      property: _embedding
    product: platform
    readable_by: [ccaas, ticketing]
    label: KnowledgeDocument
    key: id
    access: {domain: common, module: setup, sensitivity: L2}
    edge_budget: 2
    properties: [id, organization_id, category, file_name, file_type, file_size_bytes, storage_path, product_id, 
        ccaas_audience, all_branches, assigned_branch_ids, uploaded_by, created_at]
    relationships:
    - {type: uploaded_by, to: User, to_key: id, from_column: uploaded_by}
    collection: {name: KnowledgeLibrary, owner_column: organization_id}
  accounts.setup_knowledge_org_profiles:
    product: platform
    readable_by: [ccaas, ticketing]
    key: id
    access: {domain: common, module: setup, sensitivity: L1}
    edge_budget: 1
    custom_field: product
    custom_dynamic: true
    properties:
    - organization_id
    merges_into: Tenant
    key_column: organization_id
    on_delete: remove_own_properties

  cdp.customer_profile:
    embed:
      fields: [first_name, last_name, company, city, country]
      property: _embedding
    product: platform
    readable_by: [crm, cdp, campaign, ccaas, ticketing]
    label: Contact
    key: cdp_id
    access: {domain: cdp, module: customer, sensitivity: L3}
    edge_budget: 11  # collection owner edges only, created once
    sublabels:
      column: contact_type
      mapping: {lead: Lead, prospect: Prospect, customer: Customer}
    custom_field: custom_fields
    custom_dynamic: true
    properties: [cdp_id, organization_id, first_name, last_name, gender, date_of_birth, company, city, region, country, 
        language, timezone, contact_type, acquisition_channel, acquisition_date, first_referrer, first_seen_at, 
        last_seen_at, created_at, updated_at, campaign_contact_id]
    owns_collections: [ContactProfile, ConversationHistory, TicketHistory, DealHistory, OrderHistory, ActivityHistory, 
        PurchaseHistory, CampaignHistory, DeliveryHistory, EventHistory, SessionHistory, InsightHistory, 
        NextBestActionHistory]
    # L3 because gender + date_of_birth are special-category.

  cdp.identity_keys:
    product: platform
    readable_by: [crm, cdp, campaign, ccaas, ticketing]
    label: ContactIdentity
    key: uid
    synthesize_key: "{organization_id}:{key_type}:{key_value}"
    access: {domain: cdp, module: customer, sensitivity: L2}
    edge_budget: 1
    custom_field: custom_fields
    custom_dynamic: true
    properties:
    - {from: identity_id, as: source_row_id}
    - {from: key_type, as: identity_type}
    - {from: key_value, as: identity_value}
    - cdp_id
    - organization_id
    - source_system
    - {name: confidence_score, type: float}
    - verified
    - created_at
    relationships:
    collection: {name: ContactProfile, owner_column: cdp_id}

  cdp.contact_identities:
    # Adds properties to a node another table owns: a delete here removes only what it added.
    on_delete: remove_own_properties
    product: platform
    readable_by: [crm, cdp, campaign, ccaas, ticketing]
    merges_into: ContactIdentity
    key: uid
    synthesize_key: "{organization_id}:{identity_type}:{identity_value}"
    access: {domain: cdp, module: customer, sensitivity: L2}
    edge_budget: 1
    properties: [id, organization_id, contact_id, identity_type, identity_value, source_channel, first_seen_at, 
        last_seen_at, created_at, updated_at]
    relationships:
    collection: {name: ContactProfile, owner_column: contact_id}
    # Merges onto the same natural key (org, type, value) as identity_keys.

  cdp.identity_links:
    product: platform
    mode: relationship_only
    access: {domain: cdp, module: customer, sensitivity: L2}
    from: {label: Contact, key: cdp_id, column: cdp_id}
    to: {label: Contact, key: cdp_id, column: linked_cdp_id}
    type: same_person_as
    verify: "table not present in the CDP schema reference — confirm before enabling"

  # --- behaviour (high volume, bucketed) -------------------------------------

  cdp.customer_events:
    embed:
      fields: [event_name, event_category, channel, page_title]
      property: _embedding
    product: cdp
    readable_by: [campaign, crm, webtracking]
    label: Event
    key: event_id
    access: {domain: cdp, module: behaviour, sensitivity: L2}
    edge_budget: 2
    collection: {name: EventHistory, owner_column: cdp_id, bucket_column: occurred_at}
    extra_labels:
    - {label: OnlineEvent, when: {channel: [web, mobile, app]}}
    - {label: PageViewEvent, when: {event_name: [page_view, pageview, screen_view]}}
    - {label: FormEvent, when: {event_category: [form]}}
    - {label: InteractionEvent, when: {event_category: [interaction]}}
    - {label: ConversionEvent, when: {event_category: [conversion]}}
    custom_field: custom_fields
    custom_dynamic: true
    properties: [event_id, cdp_id, organization_id, site_id, event_name, event_category, source_name, source_event_id, 
        channel, visitor_id, session_id, page_view_id, page_path, page_title, referrer, utm_source, utm_medium, 
        utm_campaign, utm_term, utm_content, device_type, browser, country, occurred_at, ingested_at, amount, currency, 
        quantity, status, reference_id]
    relationships:
    - {type: has, from: Session, from_key: uid, from_column: session_id, to_key_template: 'web:{session_id}'}
    requires_migration: [site_id, page_view_id]

  cdp.customer_sessions:
    product: cdp
    readable_by: [campaign, webtracking]
    label: Session
    key: uid
    access: {domain: cdp, module: behaviour, sensitivity: L2}
    edge_budget: 2
    collection: {name: SessionHistory, owner_column: cdp_id, bucket_column: started_at}
    extra_labels:
    - {label: OnlineSession, when: {channel: [web, mobile, app]}}
    - {label: CampaignSession, when: {utm_campaign: not_null}}
    - {label: BouncedSession, when: {is_bounce: [true]}}
    custom_field: custom_fields
    custom_dynamic: true
    properties: [session_id, cdp_id, organization_id, site_id, visitor_id, started_at, ended_at, duration_seconds, 
        entry_page, exit_page, pageview_count, is_bounce, referrer, referrer_domain, utm_source, utm_medium, 
        utm_campaign, utm_term, utm_content, campaign_ref_id, contact_ref_id, device_type, browser, platform, language, 
        country, region, city, created_at]
    relationships:
    - {type: from_campaign, to: Campaign, to_key: id, from_column: campaign_ref_id, coerce_to_int: true, create_target: 
        false}
    requires_migration: [site_id, campaign_ref_id, contact_ref_id]
    key_column: session_id
    synthesize_key: web:{session_id}
    # campaign_ref_id stays a property.

  cdp.journey_states:
    product: cdp
    label: JourneyStatus
    key: uid
    synthesize_key: "{organization_id}:{cdp_id}:{journey_name}"
    access: {domain: cdp, module: behaviour, sensitivity: L1}
    edge_budget: 1
    properties: [cdp_id, organization_id, journey_name, current_stage, entered_at, updated_at]
    relationships:
    - {type: has, from: Contact, from_key: cdp_id, from_column: cdp_id}
    # Bounded (one row per journey per customer) so it stays a direct edge.

  # --- scores, metrics, insight ----------------------------------------------

  cdp.customer_scores:
    product: cdp
    readable_by: [crm, campaign]
    key: cdp_id
    access: {domain: cdp, module: intelligence, sensitivity: L1}
    edge_budget: 1
    properties:
    - cdp_id
    - organization_id
    - engagement_score
    - value_score
    - loyalty_score
    - churn_score
    - purchase_probability
    - retention_score
    - advocacy_score
    - web_engagement_score
    - intent_score
    - digital_activity_score
    merges_into: Contact
    on_delete: remove_own_properties
  cdp.gold_customer_metrics:
    product: cdp
    readable_by: [crm, campaign]
    key: cdp_id
    access: {domain: cdp, module: intelligence, sensitivity: L1}
    edge_budget: 1
    properties:
    - cdp_id
    - organization_id
    - total_events
    - total_orders
    - {name: total_spend, type: decimal, scale: 2}
    - {name: avg_order_value, type: float}
    - last_event_at
    - last_purchase_at
    - engagement_score
    - value_score
    - loyalty_score
    - churn_score
    - purchase_probability
    - predicted_ltv
    - journey_stage
    - segment_count
    merges_into: Contact
    on_delete: remove_own_properties
  cdp.ai_insights:
    product: cdp
    readable_by: [crm, campaign]
    label: ContactInsight
    key: insight_id
    access: {domain: cdp, module: intelligence, sensitivity: L2}
    edge_budget: 1
    custom_field: custom_fields
    custom_dynamic: true
    properties: [insight_id, cdp_id, organization_id, insight_type, score, summary, explanation, generated_at]
    collection: {name: InsightHistory, owner_column: cdp_id}

  cdp.customer_recommendations:
    embed:
      fields: [recommendation]
      property: _embedding
    product: cdp
    readable_by: [crm, campaign]
    label: NextBestAction
    key: recommendation_id
    access: {domain: cdp, module: intelligence, sensitivity: L2}
    edge_budget: 1
    custom_field: custom_fields
    custom_dynamic: true
    properties: [recommendation_id, cdp_id, organization_id, recommendation_type, recommendation, confidence, 
        generated_at]
    collection: {name: NextBestActionHistory, owner_column: cdp_id}

  cdp.segments:
    product: cdp
    readable_by: [campaign]
    label: Segment
    key: segment_id
    access: {domain: cdp, module: intelligence, sensitivity: L1}
    edge_budget: 1
    custom_field: custom_fields
    custom_dynamic: true
    properties: [segment_id, organization_id, segment_name, description, created_at]
    relationships:

  cdp.customer_segments:
    product: cdp
    readable_by: [campaign]
    mode: relationship_only
    access: {domain: cdp, module: intelligence, sensitivity: L1}
    from: {label: Contact, key: cdp_id, column: cdp_id}
    to: {label: Segment, key: segment_id, column: segment_id}
    type: in_segment
    properties: [source, assigned_at]
    fan_in_warning: "Segment is a legitimate supernode. Never traverse out of it without a LIMIT; use segment_id as a Customer
      property filter for counts."

  cdp.persona_definitions:
    embed:
      fields: [name, summary, industry, persona_type]
      property: _embedding
    product: cdp
    label: Persona
    key: persona_id
    access: {domain: cdp, module: intelligence, sensitivity: L1}
    edge_budget: 1
    custom_field: custom_fields
    custom_dynamic: true
    properties: [persona_id, organization_id, persona_key, name, summary, industry, persona_type, status, version, 
        confidence, evidence_count, decision_role, model_version, created_at, updated_at]
    relationships:

  cdp.customer_persona_assignments:
    product: cdp
    mode: relationship_only
    access: {domain: cdp, module: intelligence, sensitivity: L1}
    from: {label: Contact, key: cdp_id, column: cdp_id}
    to: {label: Persona, key: persona_id, column: persona_id}
    type: matches_persona
    filter: "is_active = true"
    properties: [confidence, drift_score, assignment_source, assigned_at]

  # --- observed commerce (generic: any tenant that sells anything) -----------

  cdp.orders:
    product: cdp
    readable_by: [crm, campaign]
    label: Purchase
    extra_labels:
    - {label: PaidPurchase, when: {payment_status: [paid, captured, settled]}}
    - {label: RefundedPurchase, when: {payment_status: [refunded, partially_refunded]}}
    - {label: CancelledPurchase, when: {status: [cancelled, canceled, void]}}
    - {label: FulfilledPurchase, when: {fulfillment_status: [fulfilled, delivered, shipped]}}
    - {label: OpenPurchase, when: {fulfillment_status: [unfulfilled, processing, pending]}}
    key: order_id
    access: {domain: cdp, module: commerce, sensitivity: L2}
    edge_budget: 1
    custom_field: custom_fields
    custom_dynamic: true
    properties: [order_id, cdp_id, organization_id, order_number, status, {name: total_amount, type: decimal, scale: 2, 
          currency_column: currency}, currency, payment_status, fulfillment_status, shipping_country, created_at, 
        updated_at]
    collection: {name: PurchaseHistory, owner_column: cdp_id, bucket_column: created_at}
  ccass.agents:
    product: platform
    readable_by: [ccaas, ticketing]
    label: ContactCentreAgent
    key: id
    access: {domain: ccaas, module: workforce, sensitivity: L2}
    edge_budget: 1
    sublabels: {static: ContactCentreStaff}
    properties: [id, organization_id, display_name, email, status, setup_user_id, created_at, updated_at]
    relationships:
    - {type: acts_as, from: User, from_key: id, from_column: setup_user_id}
  ccass.skills:
    product: ccaas
    label: Skill
    key: id
    access: {domain: ccaas, module: workforce, sensitivity: L1}
    edge_budget: 1
    properties: [id, organization_id, key, name, description, is_active, created_at, updated_at]
    relationships:

  ccass.agent_skills:
    product: ccaas
    mode: relationship_only
    access: {domain: ccaas, module: workforce, sensitivity: L1}
    from: {label: ContactCentreAgent, key: id, column: agent_id}
    to: {label: Skill, key: id, column: skill_id}
    type: skilled_in
    properties: [proficiency, priority, verified_at, expires_at]
  ccass.agent_presence:
    product: ccaas
    key: id
    access: {domain: ccaas, module: workforce, sensitivity: L1}
    edge_budget: 1
    properties:
    - organization_id
    - agent_id
    - status
    - presence_state
    - reason_code
    - heartbeat_at
    - lease_expires_at
    - version
    - source
    merges_into: ContactCentreAgent
    key_column: agent_id
    on_delete: remove_own_properties

  ccass.queues:
    product: ccaas
    label: ContactCentreQueue
    key: id
    access: {domain: ccaas, module: routing, sensitivity: L1}
    edge_budget: 5
    properties: [id, organization_id, setup_queue_id, name, team_id, business_hours_id, shift_types, skills, status, 
        published_at, updated_at]
    relationships:
    - {type: owned_by, to: Team, to_key: id, from_column: team_id}
    - {type: follows, to: BusinessHours, to_key: id, from_column: business_hours_id}
  ccass.queue_members:
    product: ccaas
    tenant:
      via:
      - {column: queue_id, parent: ccass.queues, parent_key: id}
    mode: relationship_only
    access: {domain: ccaas, module: routing, sensitivity: L1}
    from: {label: ContactCentreAgent, key: id, column: agent_id}
    to: {label: ContactCentreQueue, key: id, column: queue_id}
    type: member_of
    properties: [shift_type, call_type, handles_calls, handles_email, handles_chat, handles_social, chat_concurrency, 
        email_concurrency, social_concurrency]

  ccass.queue_skills:
    product: ccaas
    mode: relationship_only
    access: {domain: ccaas, module: routing, sensitivity: L1}
    from: {label: ContactCentreQueue, key: id, column: queue_id}
    to: {label: Skill, key: id, column: skill_id}
    type: requires_skill
    properties: [requirement_type, min_proficiency, weight]

  ccass.queue_routing_profiles:
    product: ccaas

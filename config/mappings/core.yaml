  campaign.campaign_send_recipients:
    product: campaign
    label: Delivery
    key: id
    access: {domain: campaign, module: marketing, sensitivity: L2}
    edge_budget: 2
    extra_labels:
    - {label: FailedMessage,   when: {status: [failed, cancelled]}}
    - {label: SkippedMessage,  when: {status: [skipped]}}
    - {label: BouncedMessage,  when: {status: [bounced, hard_bounce, soft_bounce]}}
    - {label: PendingMessage,  when: {status: [pending, queued, queued_accounts, sending]}}
    - {label: StubMessage,     when: {any: [{status: [stub, stub_sent]}, {provider_message_id: {starts_with: ['stub-', 'stub://']}}]}}
    - {label: DeliveredMessage, when: {status: [sent, delivered], provider_message_id: {not_starts_with: ['stub-', 'stub://']}}}
    - {label: OpenedMessage,   when: {opened_at: not_null}}
    - {label: ClickedMessage,  when: {clicked_at: not_null}}
    - {label: EmailDelivery, when: {delivery_channel: [email]}}
    - {label: PushDelivery, when: {delivery_channel: [push]}}
    - {label: WebPushDelivery, when: {delivery_channel: [web_push]}}
    - {label: WhatsAppDelivery, when: {delivery_channel: [whatsapp]}}
    - {label: SmsDelivery, when: {delivery_channel: [sms]}}

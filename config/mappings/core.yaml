    product: ticketing
    label: Macro
    key: id
    access: {domain: ticketing, module: support, sensitivity: L1}
    edge_budget: 1
    properties: [id, organization_id, title, body, created_by_id, created_by_name, created_at, updated_at]
    relationships:
    - {type: created_by, to: SupportAgent, to_key: id, from_column: created_by_id}
    collection: {name: MacroLibrary, owner_column: organization_id}
  cdp.order_items:
    product: cdp
    readable_by: [crm]
    mode: relationship_only
    access: {domain: cdp, module: commerce, sensitivity: L1}
    from: {label: Product, key: id, column: inventory_product_id}
    to: {label: Purchase, key: order_id, column: order_id}
    type: has
    properties:
    - quantity
    - unit_price
    - {from: subtotal_amount, as: subtotal}
    verify: "CDP reference points order_items.product_id at cdp.products (UUID), not inventory.products. Confirm the repoint
      before enabling."
    fan_in_warning: "Product accumulates one includes edge per line item. Traverse purchase -> product only; never product
      -> purchases."

  # WEB TRACKING  (source: web tracking — generic, no industry assumption)

    collection: {name: ProductPurchaseHistory}
    note: cdp.order_items.product_id points at cdp.products (CDP's catalogue copy). Its sku finds the inventory product 
      (see `derived`), so the order links to the real catalogue node.
stub_labels:
  MarketingAgent: {key: user_id}

derived:
  campaign.campaigns.branch_name:
    lookup: {table: campaign.branches, match_local: branch_id, match_remote: id, select: name, scope: organization_id}
  campaign.campaign_template_messages.subject: {json_key: subject, from: payload}
  campaign.campaign_template_messages.body: {json_key: body, from: payload}
  campaign.campaign_send_recipients.delivery_channel:
    lookup: {table: campaign.campaign_send_batches, match_local: batch_id, match_remote: id, select: channel, scope: organization_id}
  ticketing.tickets.customer_cdp_id:
    lookup: {table: ticketing.contact_profile, match_local: customer_id, match_remote: id, select: cdp_id}
  cdp.order_items.product_sku:
    first_of:
    - {json_key: sku, from: custom_fields}
    - {lookup: {table: cdp.products, match_local: product_id, match_remote: product_id, select: sku, scope: 
          organization_id}}
  cdp.order_items.inventory_product_id: {lookup: {table: inventory.products, match_local: product_sku, match_remote: sku,
      select: id, scope: organization_id}}
  cdp.customer_profile.campaign_contact_id: {function: campaign_contact_id, from: cdp_id}
  ticketing.tickets.customer_company_id: {lookup: {table: ticketing.contact_profile, match_local: customer_id, 
        match_remote: id, select: account_id, scope: organization_id}}
  campaign.campaign_channels:
    product: campaign
    label: ChannelPlan
    key: id
    access: {domain: campaign, module: marketing, sensitivity: L1}
    edge_budget: 2
    properties: [id, campaign_id, organization_id, channel, template_id, how_it_works, planned_launch_at, status, 
        created_at, updated_at]
    relationships:
    - {type: has, from: Campaign, from_key: id, from_column: campaign_id}
    - {type: uses_template, to: MessageTemplate, to_key: id, from_column: template_id}

  campaign.campaign_template_messages:
    embed:
      fields: [subject, body]
      property: _embedding
    product: campaign
    tenant:
      via:
      - {column: template_id, parent: campaign.campaign_channel_templates, parent_key: id}
    label: TemplateVersion
    key: id
    access: {domain: campaign, module: marketing, sensitivity: L1}
    edge_budget: 1
    properties: [id, template_id, role, seq, kind, created_at, subject, body]
    relationships:
    - {type: has, from: MessageTemplate, from_key: id, from_column: template_id}
